name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-connector:
    runs-on: windows-latest
    name: Build Connector
    steps:
      - uses: actions/checkout@v4

      - name: Build .mez (zipped connector)
        shell: pwsh
        run: |
          $stagingDir = New-Item -ItemType Directory -Path "staging" -Force

          # Connector source files
          Copy-Item "GizmoSQL.pq" $stagingDir
          Copy-Item "GizmoSQL.query.pq" $stagingDir
          Copy-Item "Diagnostics.pqm" $stagingDir
          Copy-Item "OdbcConstants.pqm" $stagingDir
          Copy-Item "resources.resx" $stagingDir

          # Icons (flattened into .mez root for Extension.Contents)
          Copy-Item "icons\*.png" $stagingDir

          Compress-Archive -Path "staging\*" -DestinationPath "GizmoSQL.zip"
          Rename-Item "GizmoSQL.zip" "GizmoSQL.mez"

          Write-Host "Built GizmoSQL.mez ($(Get-Item GizmoSQL.mez | Select-Object -ExpandProperty Length) bytes)"

      - name: Install Power Query SDK Tools
        shell: pwsh
        run: |
          $nugetUrl = "https://www.nuget.org/api/v2/package/Microsoft.PowerQuery.SdkTools"
          Invoke-WebRequest -Uri $nugetUrl -OutFile "sdktools.zip"
          Expand-Archive -Path "sdktools.zip" -DestinationPath "sdktools"
          $makePqxDir = (Get-ChildItem -Path "sdktools" -Filter "MakePQX.exe" -Recurse | Select-Object -First 1).DirectoryName
          Write-Host "MakePQX directory: $makePqxDir"
          Write-Host "Contents:"
          Get-ChildItem $makePqxDir | Select-Object Name
          echo "MAKEPQX_DIR=$makePqxDir" >> $env:GITHUB_ENV
          Write-Host "Installed MakePQX from Microsoft.PowerQuery.SdkTools"

      - name: Pack .mez into .pqx
        shell: pwsh
        run: |
          & "$env:MAKEPQX_DIR\MakePQX.exe" pack -mz GizmoSQL.mez -t GizmoSQL.pqx
          Write-Host "Packed GizmoSQL.pqx ($(Get-Item GizmoSQL.pqx | Select-Object -ExpandProperty Length) bytes)"

      - name: Upload .mez artifact
        uses: actions/upload-artifact@v4
        with:
          name: GizmoSQL.mez
          path: GizmoSQL.mez
          if-no-files-found: error

      - name: Upload .pqx artifact
        uses: actions/upload-artifact@v4
        with:
          name: GizmoSQL.pqx
          path: GizmoSQL.pqx
          if-no-files-found: error

  integration-test:
    runs-on: ubuntu-latest
    name: Integration Tests
    timeout-minutes: 15
    services:
      gizmosql:
        image: gizmodata/gizmosql:latest
        ports:
          - 31337:31337
        env:
          GIZMOSQL_USERNAME: gizmosql_user
          GIZMOSQL_PASSWORD: gizmosql_password
          DATABASE_FILENAME: /tmp/test.duckdb
          TLS_ENABLED: "0"
          PRINT_QUERIES: "1"
    steps:
      - name: Install ODBC runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc

      - name: Download latest GizmoSQL ODBC driver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gizmodata/gizmosql-odbc-driver \
            --pattern "libgizmosql-odbc-linux-x64.so" \
            --dir /tmp
          chmod +x /tmp/libgizmosql-odbc-linux-x64.so

      - name: Wait for GizmoSQL
        run: |
          for i in $(seq 1 30); do
            nc -z localhost 31337 && echo "GizmoSQL is ready" && exit 0
            echo "Waiting for GizmoSQL... ($i/30)"
            sleep 2
          done
          echo "GizmoSQL did not start in time" && exit 1

      - name: Register ODBC driver
        run: |
          sudo tee /etc/odbcinst.ini > /dev/null << 'EOF'
          [GizmoSQL ODBC Driver]
          Description = GizmoSQL ODBC Driver
          Driver      = /tmp/libgizmosql-odbc-linux-x64.so
          EOF

      - name: Run integration tests
        run: |
          set -euo pipefail
          CONN="Driver=/tmp/libgizmosql-odbc-linux-x64.so;host=localhost;port=31337;uid=gizmosql_user;pwd=gizmosql_password;useEncryption=false"

          # isql exits 0 even when SQL statements fail, so we must check output
          run_isql() {
            local desc=$1; shift
            echo "--- $desc ---"
            local output
            output=$("$@" 2>&1) || true
            echo "$output"
            if echo "$output" | grep -qi '\[ISQL\]ERROR\|^\[S'; then
              echo "FAIL: $desc"
              return 1
            fi
          }

          echo "=== Test 1: Basic SELECT ==="
          run_isql "SELECT via connection string" bash -c "echo 'SELECT 42 AS answer;' | isql -v -k '$CONN'"

          echo "=== Test 2: DDL/DML round-trip ==="
          run_isql "DDL/DML round-trip" isql -v -k "$CONN" << 'SQL'
          CREATE TABLE test_table (id INTEGER, name VARCHAR, value DOUBLE)
          INSERT INTO test_table VALUES (1, 'alice', 3.14)
          INSERT INTO test_table VALUES (2, 'bob', 2.72)
          INSERT INTO test_table VALUES (3, 'charlie', 1.41)
          SELECT id, name, value FROM test_table ORDER BY id
          UPDATE test_table SET value = 9.99 WHERE id = 2
          SELECT id, name, value FROM test_table WHERE id = 2
          DELETE FROM test_table WHERE id = 3
          SELECT COUNT(*) AS row_count FROM test_table
          DROP TABLE test_table
          SQL

          echo "=== Test 3: Cross-connection persistence ==="
          run_isql "CREATE TABLE" bash -c "echo 'CREATE TABLE cross_conn_test (id INTEGER, val VARCHAR);' | isql -v -k '$CONN'"
          run_isql "INSERT" bash -c "echo 'INSERT INTO cross_conn_test VALUES (1, '\''hello'\'');' | isql -v -k '$CONN'"
          run_isql "SELECT" bash -c "echo 'SELECT id, val FROM cross_conn_test;' | isql -v -k '$CONN'"
          run_isql "DROP TABLE" bash -c "echo 'DROP TABLE cross_conn_test;' | isql -v -k '$CONN'"

          echo "=== All integration tests passed ==="

  sign-connector:
    needs: [build-connector, integration-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    name: Sign Connector
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download .pqx artifact
        uses: actions/download-artifact@v4
        with:
          name: GizmoSQL.pqx

      - name: Install Power Query SDK Tools (for verification)
        shell: pwsh
        run: |
          $nugetUrl = "https://www.nuget.org/api/v2/package/Microsoft.PowerQuery.SdkTools"
          Invoke-WebRequest -Uri $nugetUrl -OutFile "sdktools.zip"
          Expand-Archive -Path "sdktools.zip" -DestinationPath "sdktools"
          $makePqxDir = (Get-ChildItem -Path "sdktools" -Filter "MakePQX.exe" -Recurse | Select-Object -First 1).DirectoryName
          echo "MAKEPQX_DIR=$makePqxDir" >> $env:GITHUB_ENV

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install sign CLI
        run: dotnet tool install --global sign --version 0.9.1-beta.26102.1

      - name: Sign .pqx with Azure Key Vault
        shell: pwsh
        run: |
          sign code azure-key-vault GizmoSQL.pqx `
            --azure-key-vault-url "${{ secrets.AZURE_KEY_VAULT_URI }}" `
            --azure-key-vault-certificate "${{ secrets.AZURE_CERT_NAME }}" `
            --timestamp-url http://timestamp.digicert.com

      - name: Verify signature
        shell: pwsh
        run: |
          # MakePQX verify has a known .NET assembly bug — it verifies correctly
          # but crashes during JSON result serialization (System.Threading.Tasks.Extensions
          # version mismatch). Suppress the non-zero exit code and check output instead.
          $ErrorActionPreference = "Continue"
          $output = & "$env:MAKEPQX_DIR\MakePQX.exe" verify GizmoSQL.pqx 2>&1 | Out-String
          Write-Host $output
          if ($output -match "not signed|invalid signature|verification failed") {
            throw "Signature verification failed"
          }
          Write-Host "Signature verification complete"

      - name: Upload signed .pqx artifact
        uses: actions/upload-artifact@v4
        with:
          name: GizmoSQL-signed.pqx
          path: GizmoSQL.pqx
          if-no-files-found: error

  build-bundled-msi:
    needs: [sign-connector]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    name: Build Bundled MSI
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download signed .pqx artifact
        uses: actions/download-artifact@v4
        with:
          name: GizmoSQL-signed.pqx
          path: installer/connector

      - name: Download ODBC driver DLL from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gizmodata/gizmosql-odbc-driver `
            --pattern "gizmosql-odbc-windows-x64.dll" `
            --dir installer\bin
          Rename-Item installer\bin\gizmosql-odbc-windows-x64.dll gizmosql-odbc.dll

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Copy VC++ runtime DLLs
        shell: pwsh
        run: |
          $crtDir = Join-Path $env:VCToolsRedistDir "x64\Microsoft.VC143.CRT"
          Write-Host "VC++ CRT directory: $crtDir"
          $dlls = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_codecvt_ids.dll")
          foreach ($dll in $dlls) {
            $src = Join-Path $crtDir $dll
            if (!(Test-Path $src)) { throw "Missing: $src" }
            Copy-Item $src "installer\bin\"
            Write-Host "Copied $dll"
          }

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add WixToolset.UI.wixext/6.0.2

      - name: Convert logo to BMP for installer dialogs
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          # Create banner (493x58)
          $logo = [System.Drawing.Image]::FromFile("${{ github.workspace }}\installer\gizmosql_logo.png")
          $banner = New-Object System.Drawing.Bitmap(493, 58)
          $g = [System.Drawing.Graphics]::FromImage($banner)
          $g.Clear([System.Drawing.Color]::White)
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
          $g.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
          $g.DrawImage($logo, 10, 4, 200, 50)
          $g.Dispose()
          $banner.Save("${{ github.workspace }}\installer\banner.bmp", [System.Drawing.Imaging.ImageFormat]::Bmp)
          # Create dialog (493x312) — logo in bottom-left to avoid
          # overlapping WiX welcome/completion title text area.
          $dialog = New-Object System.Drawing.Bitmap(493, 312)
          $g = [System.Drawing.Graphics]::FromImage($dialog)
          $g.Clear([System.Drawing.Color]::White)
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
          $g.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
          $g.DrawImage($logo, 20, 220, 160, 40)
          $g.Dispose()
          $dialog.Save("${{ github.workspace }}\installer\dialog.bmp", [System.Drawing.Imaging.ImageFormat]::Bmp)
          $logo.Dispose()

      - name: Create license.rtf
        shell: pwsh
        run: |
          $license = Get-Content "${{ github.workspace }}\LICENSE" -Raw
          $rtf = "{\rtf1\ansi\deff0 {\fonttbl {\f0 Consolas;}}\f0\fs18 " + ($license -replace "`n", "\par ") + "}"
          Set-Content -Path "${{ github.workspace }}\installer\license.rtf" -Value $rtf

      - name: Build MSI
        run: |
          wix build `
            "${{ github.workspace }}\installer\GizmoSqlBundle.wxs" `
            -arch x64 `
            -b BinDir="${{ github.workspace }}\installer\bin" `
            -b ConnectorDir="${{ github.workspace }}\installer\connector" `
            -b "${{ github.workspace }}\installer" `
            -o "${{ github.workspace }}\installer\GizmoSQL-PowerBI-Setup-x64.msi" `
            -ext WixToolset.UI.wixext

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install AzureSignTool
        run: dotnet tool install --global AzureSignTool

      - name: Sign MSI
        run: |
          AzureSignTool sign `
            --azure-key-vault-url "${{ secrets.AZURE_KEY_VAULT_URI }}" `
            --azure-key-vault-certificate "${{ secrets.AZURE_CERT_NAME }}" `
            --azure-key-vault-managed-identity `
            --timestamp-rfc3161 http://timestamp.digicert.com `
            --timestamp-digest sha256 `
            --file-digest sha256 `
            --verbose `
            "${{ github.workspace }}\installer\GizmoSQL-PowerBI-Setup-x64.msi"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: GizmoSQL-PowerBI-Setup-x64.msi
          path: installer/GizmoSQL-PowerBI-Setup-x64.msi
          if-no-files-found: error

  release:
    needs: [sign-connector, build-bundled-msi, integration-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: Release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download .mez artifact
        uses: actions/download-artifact@v4
        with:
          name: GizmoSQL.mez
          path: release

      - name: Download signed .pqx artifact
        uses: actions/download-artifact@v4
        with:
          name: GizmoSQL-signed.pqx
          path: release

      - name: Download bundled MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: GizmoSQL-PowerBI-Setup-x64.msi
          path: release

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes-start-tag "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')" \
            release/*
